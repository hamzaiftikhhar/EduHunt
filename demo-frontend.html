<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Recommender - FYP Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }

        select,
        input {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .stats {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            text-align: center;
        }

        .stat-item {
            padding: 15px;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .course-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .course-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .course-thumbnail {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5em;
            font-weight: bold;
        }

        .course-content {
            padding: 20px;
        }

        .course-provider {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            margin-bottom: 10px;
        }

        .course-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .course-description {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .course-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.9em;
        }

        .course-level {
            color: #764ba2;
            font-weight: 600;
        }

        .course-price {
            background: #4caf50;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
        }

        .course-rating {
            color: #ffa500;
            font-weight: bold;
        }

        .visit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .visit-btn:hover {
            transform: scale(1.05);
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.5em;
            padding: 50px;
        }

        .error {
            background: #ff5252;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }

        .pagination button {
            padding: 10px 20px;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>🎓 Course Recommender</h1>
            <p class="subtitle">Find the perfect course for your learning journey</p>
        </header>

        <div id="stats" class="stats"></div>

        <div class="filters">
            <div class="filter-group">
                <label for="search">Search</label>
                <input type="text" id="search" placeholder="Search courses...">
            </div>
            <div class="filter-group">
                <label for="provider">Provider</label>
                <select id="provider">
                    <option value="">All Providers</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="category">Category</label>
                <select id="category">
                    <option value="">All Categories</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="level">Level</label>
                <select id="level">
                    <option value="">All Levels</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="price">Price</label>
                <select id="price">
                    <option value="">All Prices</option>
                </select>
            </div>
            <div class="filter-group" style="justify-content: flex-end;">
                <label>&nbsp;</label>
                <button onclick="loadCourses()">Apply Filters</button>
            </div>
        </div>

        <div id="error" class="error" style="display: none;"></div>
        <div id="loading" class="loading" style="display: none;">Loading courses...</div>
        <div id="courses" class="courses-grid"></div>
        <div id="pagination" class="pagination"></div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3001/api';
        let currentPage = 1;
        let totalPages = 1;

        // Load filter options on page load
        async function loadFilterOptions() {
            try {
                const response = await fetch(`${API_BASE_URL}/courses/filters/options`);
                const data = await response.json();

                if (data.success) {
                    populateSelect('provider', data.data.providers);
                    populateSelect('category', data.data.categories);
                    populateSelect('level', data.data.levels);
                    populateSelect('price', data.data.prices);
                }
            } catch (error) {
                console.error('Error loading filter options:', error);
            }
        }

        function populateSelect(id, options) {
            const select = document.getElementById(id);
            options.forEach(option => {
                const optionElement = document.createElement('option');
                optionElement.value = option;
                optionElement.textContent = option;
                select.appendChild(optionElement);
            });
        }

        // Load statistics
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE_URL}/courses/stats/summary`);
                const data = await response.json();

                if (data.success) {
                    const statsHTML = `
                        <div class="stat-item">
                            <div class="stat-number">${data.data.totalCourses}</div>
                            <div class="stat-label">Total Courses</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number">${data.data.freeCourses}</div>
                            <div class="stat-label">Free Courses</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number">${data.data.providers.length}</div>
                            <div class="stat-label">Providers</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number">${data.data.categories.length}</div>
                            <div class="stat-label">Categories</div>
                        </div>
                    `;
                    document.getElementById('stats').innerHTML = statsHTML;
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Load courses
        async function loadCourses(page = 1) {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const coursesContainer = document.getElementById('courses');

            loading.style.display = 'block';
            error.style.display = 'none';
            coursesContainer.innerHTML = '';

            try {
                const params = new URLSearchParams({
                    page: page,
                    limit: 12,
                    ...(document.getElementById('search').value && { search: document.getElementById('search').value }),
                    ...(document.getElementById('provider').value && { provider: document.getElementById('provider').value }),
                    ...(document.getElementById('category').value && { category: document.getElementById('category').value }),
                    ...(document.getElementById('level').value && { level: document.getElementById('level').value }),
                    ...(document.getElementById('price').value && { price: document.getElementById('price').value })
                });

                const response = await fetch(`${API_BASE_URL}/courses?${params}`);
                const data = await response.json();

                loading.style.display = 'none';

                if (data.success) {
                    currentPage = parseInt(data.currentPage);
                    totalPages = data.totalPages;

                    if (data.data.length === 0) {
                        coursesContainer.innerHTML = '<p style="color: white; text-align: center; grid-column: 1/-1;">No courses found. Try different filters!</p>';
                    } else {
                        data.data.forEach(course => {
                            coursesContainer.appendChild(createCourseCard(course));
                        });
                    }

                    updatePagination();
                } else {
                    throw new Error(data.message);
                }
            } catch (err) {
                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent = `Error: ${err.message}. Make sure the API server is running!`;
            }
        }

        function createCourseCard(course) {
            const card = document.createElement('div');
            card.className = 'course-card';

            card.innerHTML = `
                <div class="course-thumbnail">${course.provider}</div>
                <div class="course-content">
                    <span class="course-provider">${course.provider}</span>
                    <h3 class="course-title">${course.title}</h3>
                    <p class="course-description">${course.description.substring(0, 120)}...</p>
                    <div class="course-meta">
                        <span class="course-level">${course.level}</span>
                        <span class="course-rating">⭐ ${course.rating}</span>
                    </div>
                    <div class="course-meta">
                        <span>${course.duration}</span>
                        <span class="course-price">${course.price}</span>
                    </div>
                    <button class="visit-btn" onclick="window.open('${course.url}', '_blank')">
                        Visit Course →
                    </button>
                </div>
            `;

            return card;
        }

        function updatePagination() {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = `
                <button onclick="loadCourses(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                    ← Previous
                </button>
                <span style="color: white; padding: 10px;">
                    Page ${currentPage} of ${totalPages}
                </span>
                <button onclick="loadCourses(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                    Next →
                </button>
            `;
        }

        // Initialize
        window.onload = () => {
            loadFilterOptions();
            loadStats();
            loadCourses();
        };

        // Search on Enter key
        document.getElementById('search').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loadCourses();
            }
        });
    </script>
</body>

</html>
